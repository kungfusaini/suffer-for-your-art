[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "suffer_for_your_art"
version = "0.1.0"
description = "A minimal pure-digital closed-loop AI painting MVP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "sumeet"}]
dependencies = ["Pillow>=10"]

[project.scripts]
suffer-for-your-art = "suffer_for_your_art.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["suffer_for_your_art*"]

[tool.setuptools.package-data]
"suffer_for_your_art" = ["web/*"]
